<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Faculty Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #f5f7fa;
  --surface:  #ffffff;
  --surface2: #eef1f6;
  --accent:   #4285F4;
  --accent2:  #34A853;
  --text:     #333333;
  --muted:    #888ea8;
  --border:   #dde2ee;
  --radius:   14px;
  --btn-radius: 10px;
  --font:     'Inter', sans-serif;
  --font-size: 14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:var(--font-size);background:var(--bg);color:var(--text);height:100dvh;display:flex;overflow:hidden}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999}
#loading .spin{width:46px;height:46px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--muted);font-size:.85rem}

/* ── Sidebar (FAQs) ── */
.sidebar{width:280px;min-width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s}
.sidebar-header{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.sidebar-header h2{font-size:.9rem;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:8px}
.sidebar-header h2 span{font-size:1.1rem}
.sidebar-close-btn{display:none;background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 6px;border-radius:8px;margin-left:auto}
.sidebar-close-btn:hover{color:var(--text);background:var(--surface2)}

.faq-section{flex:1;overflow-y:auto;padding:14px}
.faq-section::-webkit-scrollbar{width:3px}
.faq-section::-webkit-scrollbar-thumb{background:var(--border)}
.faq-label{font-size:.68rem;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;font-weight:600}
.faq-chip{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:.78rem;color:var(--text);cursor:pointer;text-align:left;transition:all .18s;white-space:normal;line-height:1.4;width:100%;margin-bottom:6px;display:block}
.faq-chip:hover{border-color:var(--accent);color:var(--accent);background:#f0f5ff}

.sidebar-stats{padding:14px;border-top:1px solid var(--border)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-row strong{color:var(--text)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── Topbar ── */
.topbar{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;flex-shrink:0}
.bot-avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;flex-shrink:0;font-size:20px;display:flex;align-items:center;justify-content:center;background:var(--surface2);overflow:hidden}
.bot-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.topbar-info h1{font-size:.95rem;font-weight:600;color:var(--text)}
.topbar-info p{font-size:.7rem;color:var(--accent2)}
.tts-pill{margin-left:auto;background:var(--surface2);border:1px solid var(--accent);border-radius:99px;padding:4px 12px;font-size:.72rem;color:var(--accent);display:none;align-items:center;gap:5px}
.tts-pill.show{display:flex}
.menu-toggle{display:none;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text);padding:4px;margin-right:4px}

/* ── Messages ── */
.messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg{display:flex;gap:10px;max-width:88%;animation:msgIn .22s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg-avatar-wrap{width:32px;height:32px;border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden}
.msg.bot .msg-avatar-wrap{background:var(--surface2);border:1px solid var(--border)}
.msg.user .msg-avatar-wrap{background:var(--accent);color:#fff}
.msg-avatar-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.msg-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.bubble{padding:11px 15px;border-radius:16px;font-size:.875rem;line-height:1.6;word-break:break-word}
.msg.bot  .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:4px;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.msg.user .bubble{background:var(--accent);color:#fff;border-top-right-radius:4px}

/* Typing dots */
.typing-dots{display:flex;gap:4px;align-items:center;padding:4px 0}
.typing-dots span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:dot 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* ── Faculty profile cards ── */
.faculty-grid{display:flex;flex-direction:column;gap:10px;margin-top:10px;width:100%}
.faculty-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;gap:0;transition:box-shadow .2s,transform .2s;cursor:default}
.faculty-card:hover{box-shadow:0 6px 20px rgba(66,133,244,.12);transform:translateY(-2px)}
.faculty-card-img{width:90px;min-width:90px;height:110px;object-fit:cover;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.faculty-card-img img{width:100%;height:100%;object-fit:cover}
.faculty-card-img .placeholder-icon{font-size:2.5rem;color:var(--muted)}
.faculty-card-body{flex:1;padding:12px 14px;min-width:0}
.faculty-card-body h4{font-size:.88rem;font-weight:600;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faculty-meta{display:flex;flex-wrap:wrap;gap:4px 10px}
.faculty-meta-item{font-size:.73rem;color:var(--muted);display:flex;align-items:center;gap:3px;min-width:0}
.faculty-meta-item .label{color:var(--accent);font-weight:600;white-space:nowrap}
.faculty-meta-item .value{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.faculty-email{font-size:.72rem;color:var(--accent);margin-top:5px;word-break:break-all}
.faculty-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.68rem;font-weight:600;background:#e8f5e9;color:#2e7d32;margin-bottom:6px}

/* count pill */
.results-pill{font-size:.75rem;color:var(--muted);margin-bottom:6px;font-weight:500}

/* ── Input area ── */
.input-area{padding:12px 18px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.input-area textarea{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-family:var(--font);font-size:.88rem;resize:none;outline:none;max-height:100px;transition:border .2s;line-height:1.5}
.input-area textarea:focus{border-color:var(--accent)}
.input-area textarea::placeholder{color:var(--muted)}
.input-area textarea:disabled{opacity:.5;cursor:not-allowed}
.send-btn{width:42px;height:42px;background:var(--accent2);border:none;border-radius:var(--btn-radius);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.send-btn:hover{filter:brightness(1.1);transform:scale(1.05)}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.mic-btn{width:42px;height:42px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--btn-radius);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.mic-btn:hover{border-color:var(--accent);color:var(--accent)}
.mic-btn.recording{background:rgba(234,67,53,.1);border-color:#ea4335;color:#ea4335;animation:micPulse 1s infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(234,67,53,.35)}50%{box-shadow:0 0 0 8px rgba(234,67,53,0)}}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(52,168,83,.92);color:#fff;padding:8px 18px;border-radius:99px;font-size:.82rem;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* ── Mobile overlay ── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:89}
.sidebar-overlay.show{display:block}

/* ── Responsive ── */
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;height:100%;z-index:90;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex;align-items:center;justify-content:center}
  .sidebar-close-btn{display:inline-flex;align-items:center;justify-content:center}
  .msg{max-width:96%}
  .faculty-card-img{width:70px;min-width:70px;height:90px}
}
@media(max-width:480px){
  .faculty-card{flex-direction:column}
  .faculty-card-img{width:100%;height:140px}
  .faculty-grid .faculty-card .faculty-card-img{border-radius:14px 14px 0 0}
  .topbar{padding:10px 14px}
  .messages{padding:12px}
  .input-area{padding:10px 12px;gap:6px}
  .faculty-meta-item .value{max-width:120px}
}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p>Loading Faculty Assistant...</p></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- Sidebar — FAQs + Stats -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2><span>🎓</span> Faculty Assistant<button class="sidebar-close-btn" onclick="closeSidebar()" aria-label="Close menu">✕</button></h2>
  </div>
  <div class="faq-section" id="faqSection">
    <div class="faq-label">Quick Searches</div>
    <div id="faqChips"></div>
  </div>
  <div class="sidebar-stats" id="sidebarStats" style="display:none">
    <div class="stat-row"><span>Session Queries</span><strong id="statQueries">0</strong></div>
    <div class="stat-row"><span>Profiles Found</span><strong id="statProfiles">0</strong></div>
  </div>
</div>

<!-- Main chat -->
<div class="main">
  <div class="topbar">
    <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()" title="Quick searches">☰</button>
    <div class="bot-avatar" id="topbarAvatar">🎓</div>
    <div class="topbar-info">
      <h1 id="topbarName">Faculty Assistant</h1>
      <p id="topbarStatus">● Online · Powered by SmartChat</p>
    </div>
    <div class="tts-pill" id="ttsPill">🔊 Speaking...</div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Voice input">🎤</button>
    <textarea id="msgInput"
      placeholder="Search faculty — e.g. 'Who is Dr. Amina?' or 'List all lecturers in CS'"
      rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'">
    </textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const API_URL = '';
let BOT_CONFIG  = null;
let BOT_AVATAR  = '🎓';
let recognition = null;
let ttsQueue    = [];
let ttsPlaying  = false;
let sessionId   = crypto.randomUUID();

// Session stats
let statQueries  = 0;
let statProfiles = 0;

// ── Resolve bot_id from URL ─────────────────────────────────────
// Supports the dashboard's embed/preview path style (.../123) as
// well as ?bot_id=123 or ?chatbot_id=123 query params.
function _getBotIdFromUrl() {
  const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
  if (/^\d+$/.test(path)) return path;
  const params = new URLSearchParams(window.location.search);
  return params.get('bot_id') || params.get('chatbot_id') || '';
}
const BOT_ID = _getBotIdFromUrl();

// ── Sidebar toggle (mobile) ────────────────────────────────────
function toggleSidebar() {
  const sb  = document.getElementById('sidebar');
  const ov  = document.getElementById('sidebarOverlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ── Init ──────────────────────────────────────────────────────
async function init() {
  try {
    const qs  = BOT_ID ? `?bot_id=${encodeURIComponent(BOT_ID)}` : '';
    const res = await fetch(`/bot-config${qs}`);
    BOT_CONFIG = await res.json();
    applyConfig(BOT_CONFIG);
    buildFaqChips(BOT_CONFIG.faqs || []);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('sidebarStats').style.display = 'block';
    appendBotMsg(BOT_CONFIG.welcome_msg || 'Hello! 🎓 How can I help you find faculty today?');
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:#ea4335">⚠️ Failed to load: ${e.message}</p>`;
  }
}

// ── Apply DB customization ────────────────────────────────────
function applyConfig(cfg) {
  const accent   = cfg.theme_color      || '#4285F4';
  const action   = cfg.btn_color        || '#34A853';
  const bg       = cfg.background_color || '#f5f7fa';
  const txt      = cfg.text_color       || '#333333';
  const radius   = cfg.btn_radius       || '10px';
  const bgLight  = _isLight(bg);
  const acLight  = _isLight(accent);
  const actLight = _isLight(action);

  const surface  = bgLight ? _adj(bg, -10) : _adj(bg, 15);
  const surface2 = bgLight ? _adj(bg, -20) : _adj(bg, 25);
  const border   = bgLight ? _adj(bg, -38) : _adj(bg, 45);
  const muted    = bgLight ? _adj(txt,  80) : _adj(txt, -80);
  const userBg   = accent;
  const userTxt  = acLight ? '#111' : '#fff';
  const acHov    = _adj(accent, bgLight ? -18 : 20);
  const actHov   = _adj(action, bgLight ? -18 : 20);

  let el = document.getElementById('dyn-style');
  if (!el) { el = document.createElement('style'); el.id = 'dyn-style'; document.head.appendChild(el); }

  el.textContent = [
    ':root{',
    '  --bg:'+bg+';--surface:'+surface+';--surface2:'+surface2+';--border:'+border+';',
    '  --accent:'+accent+';--accent2:'+action+';--text:'+txt+';--muted:'+muted+';',
    '  --btn-radius:'+radius+';--font:\''+( cfg.font_family||'Inter')+'\',sans-serif;',
    '  --font-size:'+(cfg.font_size||14)+'px;',
    '}',
    'body{background:'+bg+' !important;color:'+txt+' !important}',
    // Sidebar
    '.sidebar{background:'+surface+' !important;border-color:'+border+' !important}',
    '.sidebar-header{border-color:'+border+' !important}',
    '.sidebar-header h2{color:'+accent+' !important}',
    '.faq-section::-webkit-scrollbar-thumb{background:'+border+' !important}',
    '.faq-chip{background:'+surface2+' !important;border-color:'+border+' !important;color:'+txt+' !important}',
    '.faq-chip:hover{border-color:'+accent+' !important;color:'+accent+' !important;background:'+_adj(accent,bgLight?55:-55)+' !important}',
    '.faq-label{color:'+muted+' !important}',
    '.sidebar-stats{border-color:'+border+' !important}',
    '.stat-row{border-color:'+border+' !important;color:'+muted+' !important}',
    '.stat-row strong{color:'+txt+' !important}',
    // Topbar
    '.topbar{background:'+surface+' !important;border-color:'+border+' !important}',
    '.topbar-info h1{color:'+txt+' !important}',
    '.topbar-info p{color:'+action+' !important}',
    '.menu-toggle{color:'+txt+' !important}',
    // Chat
    '.messages{background:'+bg+' !important}',
    '.msg.bot .bubble{background:'+surface+' !important;border-color:'+border+' !important;color:'+txt+' !important}',
    '.msg.user .bubble{background:'+userBg+' !important;color:'+userTxt+' !important}',
    '.msg.bot .msg-avatar-wrap{background:'+surface2+' !important;border-color:'+border+' !important}',
    '.msg.user .msg-avatar-wrap{background:'+accent+' !important;color:'+(acLight?'#111':'#fff')+' !important}',
    // Faculty cards
    '.faculty-card{background:'+surface+' !important;border-color:'+border+' !important}',
    '.faculty-card:hover{box-shadow:0 6px 20px '+accent+'22 !important}',
    '.faculty-card-img{background:'+surface2+' !important}',
    '.faculty-card-body h4{color:'+txt+' !important}',
    '.faculty-meta-item{color:'+muted+' !important}',
    '.faculty-meta-item .label{color:'+accent+' !important}',
    '.faculty-email{color:'+accent+' !important}',
    '.faculty-badge{background:'+_adj(action,bgLight?55:-55)+' !important;color:'+action+' !important}',
    '.results-pill{color:'+muted+' !important}',
    // Input
    '.input-area{background:'+surface+' !important;border-color:'+border+' !important}',
    '.input-area textarea{background:'+surface2+' !important;border-color:'+border+' !important;color:'+txt+' !important}',
    '.input-area textarea:focus{border-color:'+accent+' !important}',
    '.send-btn{background:'+action+' !important;border-radius:'+radius+' !important;color:'+(actLight?'#000':'#fff')+' !important}',
    '.mic-btn{background:'+surface2+' !important;border-color:'+border+' !important;color:'+txt+' !important}',
    '.mic-btn:hover{border-color:'+accent+' !important;color:'+accent+' !important}',
    // TTS
    '.tts-pill{border-color:'+accent+' !important;color:'+accent+' !important;background:'+surface2+' !important}',
  ].join('\n');

  document.getElementById('topbarName').textContent = cfg.name || 'Faculty Assistant';
  document.title = cfg.name || 'Faculty Assistant';

  if (cfg.logo_url) {
    BOT_AVATAR = cfg.logo_url;
    const av = document.getElementById('topbarAvatar');
    av.innerHTML = '<img src="'+cfg.logo_url+'" alt="bot"/>';
  }
}

// ── FAQ chips ─────────────────────────────────────────────────
function buildFaqChips(faqs) {
  const chips = document.getElementById('faqChips');
  chips.innerHTML = '';
  if (!faqs.length) {
    // Default helpful prompts for faculty bots
    const defaults = [
      'Show all professors',
      'List lecturers in Computer Science',
      'Who studied abroad?',
      'Find faculty with PhD',
      'Show all department heads',
    ];
    defaults.forEach(q => addChip(chips, q));
    return;
  }
  faqs.forEach(faq => addChip(chips, faq.question));
}

function addChip(container, text) {
  const btn = document.createElement('button');
  btn.className = 'faq-chip';
  btn.textContent = text;
  btn.onclick = () => {
    document.getElementById('msgInput').value = text;
    sendMessage();
    if (window.innerWidth < 768) closeSidebar();
  };
  container.appendChild(btn);
}

// ── Avatars ───────────────────────────────────────────────────
function _makeAvatar(isBot) {
  const div = document.createElement('div');
  div.className = 'msg-avatar-wrap';
  if (isBot && BOT_AVATAR.startsWith('http')) {
    div.innerHTML = '<img src="'+BOT_AVATAR+'" alt="bot" onerror="this.parentElement.textContent=\'🎓\'"/>';
  } else {
    div.textContent = isBot ? '🎓' : '👤';
  }
  return div;
}

// ── Message rendering ─────────────────────────────────────────
const $msg = () => document.getElementById('messages');

function appendBotMsg(html) {
  const wrap = document.createElement('div'); wrap.className = 'msg bot';
  const body = document.createElement('div'); body.className = 'msg-body';
  const bbl  = document.createElement('div'); bbl.className  = 'bubble';
  bbl.innerHTML = stripMd(escHtml(html)).replace(/\n/g,'<br>');
  body.appendChild(bbl);
  wrap.appendChild(_makeAvatar(true));
  wrap.appendChild(body);
  $msg().appendChild(wrap);
  scrollBottom();
  playTTS(html);
  return body;
}

function appendUserMsg(text) {
  const wrap = document.createElement('div'); wrap.className = 'msg user';
  const body = document.createElement('div'); body.className = 'msg-body';
  const bbl  = document.createElement('div'); bbl.className  = 'bubble';
  bbl.textContent = text;
  body.appendChild(bbl);
  wrap.appendChild(_makeAvatar(false));
  wrap.appendChild(body);
  $msg().appendChild(wrap);
  scrollBottom();
}

function appendTyping() {
  const wrap = document.createElement('div'); wrap.className = 'msg bot'; wrap.id = 'typing';
  const body = document.createElement('div'); body.className = 'msg-body';
  const bbl  = document.createElement('div'); bbl.className  = 'bubble';
  bbl.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  body.appendChild(bbl);
  wrap.appendChild(_makeAvatar(true));
  wrap.appendChild(body);
  $msg().appendChild(wrap);
  scrollBottom();
}
function removeTyping() { const t=document.getElementById('typing'); if(t) t.remove(); }

// ── Faculty cards ─────────────────────────────────────────────
function renderFacultyResults(replyText, people) {
  const msgBody = appendBotMsg(replyText);

  if (!people || !people.length) return;

  const pill = document.createElement('div');
  pill.className = 'results-pill';
  pill.textContent = `${people.length} result${people.length !== 1 ? 's' : ''} found`;
  msgBody.appendChild(pill);

  const grid = document.createElement('div');
  grid.className = 'faculty-grid';

  people.forEach(p => {
    const card = document.createElement('div');
    card.className = 'faculty-card';

    // Image column
    const imgCol = document.createElement('div');
    imgCol.className = 'faculty-card-img';
    if (p.image && p.image.startsWith('http')) {
      const img = document.createElement('img');
      img.src = p.image;
      img.alt = p.name || '';
      img.onerror = () => { imgCol.innerHTML = '<span class="placeholder-icon">👤</span>'; };
      imgCol.appendChild(img);
    } else {
      imgCol.innerHTML = '<span class="placeholder-icon">👤</span>';
    }

    // Info column
    const info = document.createElement('div');
    info.className = 'faculty-card-body';

    const name = document.createElement('h4');
    name.textContent = p.name || 'Unknown';
    info.appendChild(name);

    if (p.designation) {
      const badge = document.createElement('div');
      badge.className = 'faculty-badge';
      badge.textContent = p.designation;
      info.appendChild(badge);
    }

    const meta = document.createElement('div');
    meta.className = 'faculty-meta';

    const fields = [
      { label: 'Dept',   value: p.department  },
      { label: 'Qual',   value: p.qualification },
      { label: 'Inst',   value: p.institution  },
    ];
    fields.forEach(f => {
      if (!f.value) return;
      const item = document.createElement('div');
      item.className = 'faculty-meta-item';
      item.innerHTML = '<span class="label">'+escHtml(f.label)+':</span>'
                     + '<span class="value" title="'+escHtml(f.value)+'">'+escHtml(f.value)+'</span>';
      meta.appendChild(item);
    });
    info.appendChild(meta);

    if (p.email) {
      const em = document.createElement('div');
      em.className = 'faculty-email';
      em.textContent = '✉ ' + p.email;
      info.appendChild(em);
    }

    card.appendChild(imgCol);
    card.appendChild(info);
    grid.appendChild(card);
  });

  msgBody.appendChild(grid);
  scrollBottom();

  // Update stats
  statProfiles += people.length;
  document.getElementById('statProfiles').textContent = statProfiles;
}

// ── Send message ──────────────────────────────────────────────
async function sendMessage() {
  const inp  = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text) return;

  inp.value = '';
  inp.style.height = 'auto';
  inp.disabled = true;
  document.getElementById('sendBtn').disabled = true;

  appendUserMsg(text);
  appendTyping();

  statQueries++;
  document.getElementById('statQueries').textContent = statQueries;

  try {
    const res  = await fetch(API_URL + '/chat', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ session_id: sessionId, message: text, bot_id: BOT_ID || undefined }),
    });
    const data = await res.json();
    removeTyping();

    if (data.type === 'faculty' && data.people && data.people.length) {
      renderFacultyResults(data.reply || '', data.people);
    } else {
      appendBotMsg(data.reply || '...');
    }
  } catch(err) {
    removeTyping();
    appendBotMsg('Connection error. Please check the server is running.');
    console.error(err);
  } finally {
    inp.disabled = false;
    document.getElementById('sendBtn').disabled = false;
    inp.focus();
  }
}

// ── TTS streaming ─────────────────────────────────────────────
async function playTTS(text) {
  if (!text) return;
  const clean = text.replace(/\{[^}]+\}/g,'').replace(/\*\*/g,'').replace(/#{1,3} /g,'').trim();
  if (!clean) return;
  ttsQueue.push(clean);
  if (!ttsPlaying) drainTTS();
}

async function drainTTS() {
  if (!ttsQueue.length) { ttsPlaying = false; return; }
  ttsPlaying = true;
  const text = ttsQueue.shift();
  const pill = document.getElementById('ttsPill');
  pill.classList.add('show');
  try {
    const res = await fetch(API_URL + '/tts', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error('TTS failed');
    const SAMPLE_RATE = 24000;
    const ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
    let nextAt = ctx.currentTime + 0.05;
    const reader = res.body.getReader();
    let leftover = new Uint8Array(0);

    const playChunk = (bytes) => {
      const samples = Math.floor(bytes.length / 2);
      if (!samples) return;
      const f32  = new Float32Array(samples);
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      for (let i = 0; i < samples; i++) f32[i] = view.getInt16(i * 2, true) / 32768;
      const buf = ctx.createBuffer(1, samples, SAMPLE_RATE);
      buf.copyToChannel(f32, 0);
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(ctx.destination);
      const start = Math.max(nextAt, ctx.currentTime);
      src.start(start); nextAt = start + buf.duration;
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const combined = new Uint8Array(leftover.length + value.length);
      combined.set(leftover); combined.set(value, leftover.length);
      const even = combined.length - (combined.length % 2);
      playChunk(combined.slice(0, even));
      leftover = combined.slice(even);
    }
    if (leftover.length >= 2) playChunk(leftover);
    const rem = Math.max(0, nextAt - ctx.currentTime);
    await new Promise(r => setTimeout(r, rem * 1000 + 200));
    ctx.close();
  } catch(e) { /* TTS optional */ }
  pill.classList.remove('show');
  drainTTS();
}

// ── Mic (Speech-to-Text) ──────────────────────────────────────
function toggleMic() {
  const btn = document.getElementById('micBtn');
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('Speech recognition not supported in this browser.');
    return;
  }
  if (recognition && btn.classList.contains('recording')) {
    recognition.stop();
    btn.classList.remove('recording');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const t = e.results[0][0].transcript;
    const inp = document.getElementById('msgInput');
    if (inp) {
      inp.value = t;
      inp.style.height = 'auto';
      inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
    }
  };
  recognition.onend  = () => btn.classList.remove('recording');
  recognition.onerror = () => { btn.classList.remove('recording'); showToast('Mic error. Try again.'); };
  recognition.start();
  btn.classList.add('recording');
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ── Utils ─────────────────────────────────────────────────────
function scrollBottom() {
  const m = $msg();
  m.scrollTop = m.scrollHeight;
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stripMd(s) {
  return s.replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1').replace(/^#{1,4}\s*/gm,'');
}
function _isLight(hex) {
  const n = parseInt((hex||'#000').replace('#','').padEnd(6,'0'), 16);
  return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) > 155;
}
function _adj(hex, amt) {
  const n = parseInt((hex||'#000000').replace('#',''), 16);
  const r = Math.min(255,Math.max(0,((n>>16)&255)+amt));
  const g = Math.min(255,Math.max(0,((n>>8)&255)+amt));
  const b = Math.min(255,Math.max(0,(n&255)+amt));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

init();
